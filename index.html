<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Decreto 5/2025 - Aprovechamientos forestales</title>
<style>
:root{--verde:#2f6b3a;--verde2:#e8f1e9;--tinta:#1f2a24;--gris:#6b7770;--borde:#d5ddd7;--ok:#1f7a3a;--okbg:#e4f4e8;--ko:#b3261e;--kobg:#fbe9e7;--fondo:#f6f8f6}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--tinta);line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:24px 16px 40px}
header h1{font-size:1.25rem;margin:0 0 4px;color:var(--verde)}
header p{margin:0;color:var(--gris);font-size:.92rem}
.prog{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-size:.88rem;color:var(--gris)}
.bar{flex:1;height:8px;background:#dfe6e1;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--verde);transition:width .3s}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--gris)}
.tag{padding:2px 9px;border-radius:20px;background:var(--verde2);color:var(--verde);font-weight:bold;font-size:.78rem}
.q{font-size:1.06rem;font-weight:bold;margin:0 0 16px;text-align:justify}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--borde);border-radius:9px;padding:11px 13px;margin:0 0 9px;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--verde);background:#f7fbf8}
.opt b{min-width:20px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.why{margin-top:14px;padding:12px 14px;border-radius:9px;font-size:.93rem;text-align:justify;display:none}
.why.ok{display:block;background:var(--okbg);border-left:4px solid var(--ok)}
.why.ko{display:block;background:var(--kobg);border-left:4px solid var(--ko)}
.actions{display:flex;justify-content:flex-end;margin-top:16px;gap:10px;flex-wrap:wrap}
.btn{background:var(--verde);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:bold;cursor:pointer}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center}
.big{font-size:3rem;font-weight:bold;color:var(--verde);margin:6px 0}
.result ul{text-align:left;padding-left:18px}
.result li{margin-bottom:8px;text-align:justify}
footer{margin-top:34px;text-align:center;font-size:.8rem;color:var(--gris)}
footer a{color:var(--gris);text-decoration:underline;cursor:pointer}
#lock{display:none;margin-top:12px}
#lock input{padding:8px 10px;border:1px solid var(--borde);border-radius:7px;font:inherit;width:200px}
#lockmsg{color:var(--ko);font-size:.85rem;min-height:1.2em;margin-top:6px}
#word{display:none}
#wordbody{background:#fff;border:1px solid var(--borde);padding:28px 34px;font-family:Arial;font-size:11pt}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  #wordbody{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="quiz">
    <header class="noprint">
      <h1>TEST DE EVALUACIÓN - Decreto 5/2025, de aprovechamientos forestales en montes no gestionados por la Junta de Castilla y León</h1>
      <p>25 preguntas · una sola respuesta correcta · corrección inmediata</p>
    </header>
    <div class="prog noprint"><span id="cnt">1 / 25</span><div class="bar"><i id="barfill"></i></div><span id="score">0 aciertos</span></div>
    <div class="card" id="stage"></div>
  </div>

  <div id="word">
    <div class="actions noprint" style="justify-content:flex-start;margin-bottom:14px">
      <button class="btn" onclick="copyWord()">Copiar para Word</button>
      <button class="btn" onclick="window.print()">Imprimir / PDF</button>
      <button class="btn" onclick="downloadDoc()">Descargar .doc</button>
      <button class="btn sec" onclick="closeWord()">Volver al test</button>
      <span id="copymsg" style="align-self:center;font-size:.85rem;color:var(--ok)"></span>
    </div>
    <div id="wordbody"></div>
  </div>

  <footer class="noprint" id="foot">
    <a onclick="toggleLock()">Acceso docente</a>
    <div id="lock">
      <input type="password" id="pw" placeholder="Contraseña" onkeydown="if(event.key==='Enter')unlock()">
      <button class="btn" style="padding:8px 14px" onclick="unlock()">Entrar</button>
      <div id="lockmsg"></div>
    </div>
  </footer>
</div>

<script>
const DATA = [{"d": "Fácil", "q": "Según su disposición final tercera, ¿cuándo entra en vigor el Decreto 5/2025, de 27 de marzo?", "o": ["A los veinte días de su publicación en el BOCyL", "Al mes de su publicación en el BOCyL", "A los tres meses de su publicación en el BOCyL", "Al día siguiente de su publicación en el BOCyL"], "c": 2, "w": "La disposición final tercera establece que el decreto entra en vigor a los tres meses de su publicación en el Boletín Oficial de Castilla y León (publicado el 31 de marzo de 2025)."}, {"d": "Fácil", "q": "¿Cuál de los siguientes aprovechamientos NO está excluido del ámbito de aplicación del Decreto 5/2025?", "o": ["Los aprovechamientos cinegéticos", "Los aprovechamientos de especies incluidas en el Catálogo de Flora Protegida de Castilla y León", "Los aprovechamientos micológicos", "El aprovechamiento de resina"], "c": 3, "w": "El artículo 1.3 excluye los aprovechamientos cinegéticos, micológicos y de especies del Catálogo de Flora Protegida (por tener regulación específica), además de los maderables y leñosos del art. 88.3 de la Ley 3/2009. La resina está expresamente regulada por el decreto."}, {"d": "Medio", "q": "Un aprovechamiento maderable que no es de turno corto ni de menor cuantía, en un monte privado sin Instrumento de Ordenación Forestal ni PORF en vigor, requiere:", "o": ["Ningún trámite, al tratarse de un monte no declarado de utilidad pública", "Declaración responsable ante el servicio territorial", "Autorización de la dirección general competente en materia de montes", "Autorización administrativa del servicio territorial con competencias en materia de montes"], "c": 3, "w": "Artículo 4.1.a): están sujetos a autorización del servicio territorial los aprovechamientos maderables y leñosos, distintos de los de turno corto o menor cuantía, en montes sin IOF o fuera del ámbito de un PORF en vigor, o cuando se pretendan realizar en condiciones distintas de las de dichos instrumentos."}, {"d": "Medio", "q": "La autorización de aprovechamientos de carácter experimental o con fines de investigación que utilicen técnicas novedosas corresponde a:", "o": ["El Consejo Regional de Medio Ambiente de Castilla y León", "La dirección general competente en materia de montes", "El servicio territorial de la provincia donde se realice el aprovechamiento", "La persona titular de la consejería competente en materia de montes"], "c": 1, "w": "Artículo 4.2 y artículo 9.2.b): estos aprovechamientos requieren autorización de la dirección general, y la competencia para resolver la ostenta su titular. Además, el art. 8.3 exige memoria justificativa suscrita por técnico forestal competente."}, {"d": "Fácil", "q": "La recolección de piña cerrada en un monte en cuantía superior a 5 kilogramos:", "o": ["No está sujeta a regulación por el decreto", "Está sujeta a declaración responsable", "Está sujeta a autorización administrativa del servicio territorial", "Solo está permitida si el monte cuenta con IOF"], "c": 1, "w": "Artículo 5.7: requieren declaración responsable los aprovechamientos de piña cerrada de más de 5 kg en montes. Según el art. 6.2, la recolección de piña cerrada de cuantía menor o igual a 5 kg no está sujeta a regulación."}, {"d": "Fácil", "q": "¿A partir de qué altura el aprovechamiento de matorral requiere la presentación de declaración responsable?", "o": ["Superior a 1,5 metros", "Superior a 0,5 metros", "Superior a 1 metro", "Superior a 2 metros"], "c": 0, "w": "Artículo 5.10: requieren declaración responsable los aprovechamientos de matorral de altura superior a 1,5 metros. El art. 6.4 declara no sujeto el de matorral de altura inferior a 1,5 metros, de especies no arbóreas."}, {"d": "Medio", "q": "El aprovechamiento mediante poda de ramas de un chopo (género Populus), cuando es de menor cuantía:", "o": ["Requiere autorización del servicio territorial", "Solo puede realizarse fuera del periodo del 1 de mayo al 31 de agosto, previa declaración responsable", "Requiere declaración responsable", "No requiere solicitud de autorización ni declaración responsable"], "c": 3, "w": "Artículo 6.3: no están sujetos los aprovechamientos mediante poda de ramas de especies de géneros diferentes a Quercus y Fraxinus cuando sean de menor cuantía. Si no son de menor cuantía, requieren declaración responsable (art. 5.5)."}, {"d": "Medio", "q": "¿Cuál es el plazo máximo para resolver y notificar la solicitud de autorización de aprovechamiento forestal y el sentido del silencio administrativo?", "o": ["Un mes; silencio desestimatorio", "Tres meses; silencio desestimatorio", "Un mes; silencio estimatorio", "Tres meses; silencio estimatorio"], "c": 0, "w": "Artículo 9.3: el plazo máximo es de un mes y, si transcurre sin resolución expresa notificada, la solicitud se entiende desestimada, por el posible perjuicio grave al medio ambiente (excepción del art. 24.1 de la Ley 39/2015)."}, {"d": "Fácil", "q": "Si la solicitud de autorización no reúne los requisitos o no se acompaña de la documentación necesaria, se requerirá a la persona interesada para que subsane en un plazo de:", "o": ["Diez días", "Cinco días", "Quince días", "Un mes"], "c": 0, "w": "Artículo 9.1, de acuerdo con el art. 68 de la Ley 39/2015: plazo de diez días para subsanar, con indicación de que, si no lo hiciere, se le tendrá por desistido de su petición previa resolución."}, {"d": "Medio", "q": "Contra la resolución dictada en el procedimiento de autorización de aprovechamiento cabe interponer:", "o": ["Recurso extraordinario de revisión ante el Consejero", "Recurso potestativo de reposición, ya que pone fin a la vía administrativa", "Recurso de alzada ante el órgano superior jerárquico del que la dictó, ya que no pone fin a la vía administrativa", "Directamente recurso contencioso-administrativo"], "c": 2, "w": "Artículo 9.4: la resolución no pone fin a la vía administrativa y contra ella podrá interponerse recurso de alzada ante el órgano superior jerárquico del que la ha dictado."}, {"d": "Medio", "q": "El documento de determinación del aprovechamiento debe estar suscrito por un técnico forestal competente cuando se trate de aprovechamientos maderables o leñosos de más de:", "o": ["100 metros cúbicos o su equivalente en toneladas o estéreos", "250 metros cúbicos o su equivalente en toneladas o estéreos", "1.000 metros cúbicos o su equivalente en toneladas o estéreos", "500 metros cúbicos o su equivalente en toneladas o estéreos"], "c": 3, "w": "Artículo 8.2, párrafo segundo: cuando se trate de aprovechamientos maderables o leñosos de más de 500 m³ (o su equivalente en toneladas o estéreos), el documento de determinación del aprovechamiento deberá estar suscrito por técnico forestal competente."}, {"d": "Medio", "q": "Si durante un aprovechamiento se detecta un pie con un nido de una especie catalogada como vulnerable, la persona titular debe:", "o": ["Cortar el pie fuera del periodo de nidificación sin necesidad de comunicación", "Continuar el aprovechamiento y comunicarlo al finalizar en la comunicación de cuantía obtenida", "Suspender todo el aprovechamiento hasta la siguiente campaña", "Excluir provisionalmente ese pie del aprovechamiento y comunicarlo inmediatamente al servicio territorial"], "c": 3, "w": "Artículo 12.1.d): se excluirán provisionalmente los pies con nidos de especies catalogadas en peligro de extinción o vulnerables, y la persona titular lo comunicará inmediatamente al servicio territorial, que establecerá las condiciones necesarias, de obligado cumplimiento."}, {"d": "Difícil", "q": "En un aprovechamiento plurianual objeto de comercialización, la comunicación de la cuantía realmente obtenida debe presentarse:", "o": ["Anualmente, antes del 31 de marzo, respecto de la anualidad anterior", "Una sola vez, en el plazo de un mes desde la finalización total del aprovechamiento", "Anualmente, antes del 31 de enero, respecto de la anualidad anterior", "En el plazo máximo de un mes desde la finalización de cada anualidad"], "c": 2, "w": "Artículo 11.3: con carácter general, la comunicación se presenta en el plazo máximo de un mes desde la finalización del aprovechamiento; pero en los plurianuales se comunicarán anualmente, antes del 31 de enero, las cuantías obtenidas en la anualidad anterior."}, {"d": "Medio", "q": "¿Quién puede presentar de forma presencial la solicitud de autorización o la declaración responsable?", "o": ["Exclusivamente una persona física cuando el aprovechamiento sea de menor cuantía", "Nadie: la presentación ha de ser siempre electrónica", "Cualquier persona física, sea cual sea la cuantía del aprovechamiento", "Cualquier persona física o jurídica cuando el aprovechamiento sea de menor cuantía"], "c": 0, "w": "Artículo 7.2.b): exclusivamente cuando se trate de una persona física y el aprovechamiento sea de menor cuantía podrá presentarse de forma presencial, además de electrónicamente. El resto de personas físicas quedan obligadas a relacionarse electrónicamente (art. 14.3 Ley 39/2015)."}, {"d": "Fácil", "q": "Con carácter general, el plazo para la ejecución de los aprovechamientos maderables y leñosos es de:", "o": ["Dos años", "Tres años", "Cinco años", "Un año"], "c": 0, "w": "Artículo 14.1: el plazo de ejecución es de dos años para los aprovechamientos maderables y leñosos y de un año para el resto, salvo que se establezcan plazos diferentes. Si no se ejecutan en plazo, la autorización o la declaración quedan sin efecto (art. 14.2)."}, {"d": "Medio", "q": "¿En qué periodo no pueden realizarse aprovechamientos mediante poda de ramas de especies de los géneros Quercus y Fraxinus?", "o": ["Entre el 1 de junio y el 15 de octubre, ambos inclusive", "Entre el 1 de mayo y el 31 de agosto, ambos inclusive", "Entre el 1 de abril y el 31 de octubre, ambos inclusive", "Entre el 15 de junio y el 30 de septiembre, ambos inclusive"], "c": 1, "w": "Disposición transitoria primera, apartado 1.b): no podrán realizarse podas de Quercus y Fraxinus entre el 1 de mayo y el 31 de agosto, ambos inclusive, además de los periodos limitados por la normativa de prevención de incendios."}, {"d": "Difícil", "q": "A efectos de la obligación de regeneración, se consideran aclareos intensos los que:", "o": ["Dejen un estrato arbóreo con menos del 30% de fracción de cabida cubierta o supongan una reducción de más del 25% de la FCC previa", "Supongan la extracción de más del 25% del área basimétrica en una sola intervención", "Dejen un estrato arbóreo con menos del 40% de fracción de cabida cubierta o supongan una reducción de más del 33% de la FCC previa", "Dejen un estrato arbóreo con menos del 20% de fracción de cabida cubierta o supongan una reducción de más del 50% de la FCC previa"], "c": 3, "w": "Disposición transitoria primera, apartado 1.c).1: son aclareos intensos los que dejen menos del 20% de FCC o reduzcan más del 50% la FCC previa. En estos casos y en cortas finales o a hecho, debe regenerarse la zona en un plazo máximo de cinco años desde la corta final."}, {"d": "Difícil", "q": "En ausencia de referente selvícola, un pinar de Pinus pinea se considera regenerado satisfactoriamente cuando alcanza un mínimo de:", "o": ["200 pies viables por hectárea", "800 pies viables por hectárea", "400 pies viables por hectárea", "600 pies viables por hectárea"], "c": 2, "w": "Disposición transitoria primera, apartado 1.c).2: 400 pies viables/ha en pinares de Pinus pinea; 800 en el resto del género Pinus; 600 pies viables o FCC superior al 40% en frondosas autóctonas; y 200 pies viables/ha para el resto de especies."}, {"d": "Medio", "q": "En una dehesa de Quercus, la regeneración de la superficie afectada es obligatoria cuando, como consecuencia del aprovechamiento, el número de pies vivos resultante sea inferior a:", "o": ["20 pies por hectárea", "30 pies por hectárea", "60 pies por hectárea", "50 pies por hectárea"], "c": 1, "w": "Disposición transitoria primera, apartado 1.c).4: si quedan menos de 30 pies vivos/ha (también por efecto acumulativo) es obligatorio regenerar en cinco años. Se considera regenerado con al menos 30 pies viables/ha o FCC del 20%, protegidos frente a herbívoros."}, {"d": "Difícil", "q": "Entre el 1 de abril y el 31 de octubre, el periodo máximo de permanencia de la madera apeada de Pinus y su leña a menos de 100 metros de una masa arbolada de dichas especies es de:", "o": ["Cuatro semanas", "Dos semanas", "Un mes", "Quince días hábiles"], "c": 1, "w": "Disposición transitoria primera, apartado 1.d).1: el periodo máximo es de cuatro semanas, que se reduce a un máximo de dos semanas entre el 1 de abril y el 31 de octubre, salvo que el servicio territorial autorice otros periodos con los compromisos del titular."}, {"d": "Difícil", "q": "En caso de astillado, los montones de astillas deberán ubicarse:", "o": ["A más de 200 metros del arbolado, sin necesidad de banda exenta de vegetación", "A más de 100 metros del arbolado y rodeados de una banda exenta de vegetación de al menos 9 metros de anchura", "A más de 100 metros del arbolado y rodeados de una banda exenta de vegetación de al menos 15 metros de anchura", "A más de 50 metros del arbolado y rodeados de una banda exenta de vegetación de al menos 5 metros de anchura"], "c": 1, "w": "Disposición transitoria primera, apartado 1.d).2: los montones de astillas se ubicarán a más de 100 m del arbolado, rodeados de una banda sin vegetación de al menos 9 m de anchura, y los depósitos provisionales se retirarán en un plazo máximo de 15 días."}, {"d": "Difícil", "q": "En las formaciones de enebros y sabinas, el aprovechamiento solo podrá ejecutarse mediante clareos, claras o cortas de entresaca, con una extracción máxima por intervención y un distanciamiento entre intervenciones sucesivas de:", "o": ["25% del área basimétrica; al menos quince años", "50% de los pies vivos; al menos cinco años", "20% del área basimétrica; al menos veinte años", "33% del área basimétrica; al menos diez años"], "c": 0, "w": "Disposición transitoria primera, apartado 1.f).1: en Juniperus communis, oxycedrus y thurifera la extracción no superará el 25% del área basimétrica por intervención, distanciadas al menos quince años. (El 50% de pies vivos y cinco años corresponden a las formaciones de ribera)."}, {"d": "Difícil", "q": "Cuando un agente medioambiental suspende provisionalmente un aprovechamiento por incumplimiento de sus condiciones, el acta o denuncia debe remitirse al órgano competente para iniciar el procedimiento:", "o": ["Dentro de los diez días siguientes", "Dentro de los cinco días siguientes", "Dentro de los dos días siguientes", "Dentro de los quince días siguientes"], "c": 2, "w": "Artículo 19.2: el acta o denuncia se remitirá dentro de los dos días siguientes al órgano competente, que deberá confirmar, modificar o levantar las medidas provisionales en el acuerdo de iniciación dentro de los quince días siguientes a su adopción; si no, quedan sin efecto."}, {"d": "Medio", "q": "En el aprovechamiento de piña cerrada mediante vibrado de árboles, el tiempo de vibración:", "o": ["No excederá de 3 segundos, pudiendo repetirse si quedan piñas en el árbol", "No excederá de 10 segundos y se realizará una única vez por árbol", "No excederá de 3 segundos y se realizará una única vez por árbol", "No excederá de 5 segundos y se realizará como máximo dos veces por árbol"], "c": 2, "w": "Disposición transitoria primera, apartado 2.c).2: el tiempo de vibración no excederá de 3 segundos y una única vez por árbol. Además, solo en parada vegetativa y nunca a partir del 15 de marzo, no en árboles de menos de 20 cm de diámetro normal y con pinza provista de protectores."}, {"d": "Fácil", "q": "En los aprovechamientos de corcho, el turno de descorche no podrá ser inferior a:", "o": ["Diez años", "Ocho años", "Nueve años", "Doce años"], "c": 0, "w": "Disposición transitoria primera, apartado 4.c).10: el turno de descorche no podrá ser inferior a diez años. La campaña de aprovechamiento de corcho va del 15 de junio al 30 de septiembre, ambos inclusive."}];

const L = "abcd";
let i = 0, hits = 0, answered = false, fails = [];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const it = DATA[i];
  answered = false;
  document.getElementById("cnt").textContent = (i+1)+" / "+DATA.length;
  document.getElementById("barfill").style.width = (i/DATA.length*100)+"%";
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  let h = '<div class="qhead"><span>Pregunta '+(i+1)+'</span><span class="tag">'+it.d+'</span></div>';
  h += '<p class="q">'+esc(it.q)+'</p>';
  it.o.forEach((o,k)=>{ h += '<button class="opt" data-k="'+k+'" onclick="pick('+k+')"><b>'+L[k]+')</b><span>'+esc(o)+'</span></button>'; });
  h += '<div class="why" id="why"></div>';
  h += '<div class="actions"><button class="btn" id="next" disabled onclick="next()">'+(i<DATA.length-1?"Siguiente":"Ver resultado")+'</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function pick(k){
  if(answered) return; answered = true;
  const it = DATA[i], btns = document.querySelectorAll(".opt");
  btns.forEach(b=>b.disabled=true);
  btns[it.c].classList.add("ok");
  const why = document.getElementById("why");
  if(k===it.c){ hits++; why.className="why ok"; why.innerHTML="<b>Correcto.</b> "+esc(it.w); }
  else { btns[k].classList.add("ko"); fails.push(i); why.className="why ko"; why.innerHTML="<b>Incorrecto. La respuesta correcta es la "+L[it.c]+").</b> "+esc(it.w); }
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  document.getElementById("next").disabled = false;
}

function next(){ if(i<DATA.length-1){ i++; render(); } else finish(); }

function finish(){
  document.getElementById("barfill").style.width = "100%";
  const nota = (hits/DATA.length*10).toFixed(2).replace(".",",");
  const msg = hits>=Math.ceil(DATA.length*0.85) ? "Excelente. Dominas el tema." : hits>=Math.ceil(DATA.length*0.5) ? "Aprobado. Repasa las preguntas falladas." : "Necesitas repasar el tema.";
  let h = '<div class="result"><p style="margin:0;color:var(--gris)">Resultado</p><div class="big">'+nota+'</div>';
  h += '<p><b>'+hits+'</b> aciertos de '+DATA.length+'. '+msg+'</p></div>';
  if(fails.length){
    h += '<div class="result"><p style="text-align:left;font-weight:bold;margin-top:18px">Preguntas falladas</p><ul>';
    fails.forEach(f=>{ const it=DATA[f]; h += '<li><b>'+(f+1)+'.</b> '+esc(it.q)+'<br><span style="color:var(--ok)">Correcta: '+L[it.c]+') '+esc(it.o[it.c])+'</span></li>'; });
    h += '</ul></div>';
  }
  h += '<div class="actions" style="justify-content:center"><button class="btn" onclick="restart()">Repetir el test</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function restart(){ i=0; hits=0; fails=[]; render(); }

/* ---- Acceso docente ---- */
function toggleLock(){ const l=document.getElementById("lock"); l.style.display = l.style.display==="block"?"none":"block"; if(l.style.display==="block") document.getElementById("pw").focus(); }
function b64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function unlock(){
  const msg = document.getElementById("lockmsg"); msg.textContent = "";
  try{
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.s), iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.i)}, key, b64(ENC.c));
    document.getElementById("wordbody").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("pw").value = "";
    document.getElementById("lock").style.display = "none";
    document.getElementById("quiz").style.display = "none";
    document.getElementById("foot").style.display = "none";
    document.getElementById("word").style.display = "block";
    window.scrollTo(0,0);
  }catch(e){ msg.textContent = "Contraseña incorrecta."; }
}
function closeWord(){
  document.getElementById("wordbody").innerHTML = "";
  document.getElementById("word").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("foot").style.display = "block";
}
async function copyWord(){
  const body = document.getElementById("wordbody"), m = document.getElementById("copymsg");
  try{
    await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([body.innerHTML],{type:"text/html"}),"text/plain":new Blob([body.innerText],{type:"text/plain"})})]);
    m.textContent = "Copiado. Pégalo en Word.";
  }catch(e){
    const r = document.createRange(); r.selectNodeContents(body); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try{ document.execCommand("copy"); m.textContent = "Copiado. Pégalo en Word."; }catch(e2){ m.textContent = "Selecciona el texto y copia con Ctrl+C."; }
    s.removeAllRanges();
  }
}
function downloadDoc(){
  const doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Arial;font-size:11pt}</style></head><body>'+document.getElementById("wordbody").innerHTML+'</body></html>';
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿",doc],{type:"application/msword"}));
  a.download = "Test_Decreto_5_2025_Aprovechamientos.doc"; document.body.appendChild(a); a.click(); a.remove();
}
render();
